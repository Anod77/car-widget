<script>
const CONFIG = {
    SMART_PROCESS_ID: 1038,
    BRAND_FIELD_ID: 'ufCrm8_1790681113',
    MODEL_FIELD_ID: 'ufCrm8_1790681206',
    DEAL_BRAND_FIELD: 'ufCrm_1790687507745',
    DEAL_MODEL_FIELD: 'ufCrm_1790687534528',
    HANDLER_URL: 'https://Anod77.github.io/car-widget/widget.html'
};

let brandMap = {};

console.log('--- DEBUG START ---');

BX24.ready(function() {
    console.log('1. BX24.ready: Сработал');
    BX24.init(function() {
        console.log('2. BX24.init: Сработал');
        const info = BX24.placement.info();
        console.log('3. Данные размещения:', info);
        
        if (info && info.placement === 'CRM_DEAL_DETAIL_TAB') {
            console.log('4. Тип: Вкладка сделки. Запускаем initWidget...');
            initWidget(info.options.ID);
        } else {
            console.log('4. Тип: Установка. Запускаем runInstall...');
            runInstall();
        }
    });
});

function runInstall() {
    console.log('Функция runInstall запущена');
    const loadingEl = document.getElementById('loading');
    const installEl = document.getElementById('install');
    const installMsg = document.getElementById('installMsg');
    
    if (loadingEl) loadingEl.style.display = 'none';
    if (installEl) installEl.style.display = 'block';

    BX24.callMethod('placement.bind', {
        PLACEMENT: 'CRM_DEAL_DETAIL_TAB',
        HANDLER: CONFIG.HANDLER_URL,
        TITLE: 'Марка и модель'
    }, function(res) {
        console.log('Результат runInstall:', res);
        if (res.error()) {
            if (installMsg) installMsg.innerHTML = '<div class="status err">Ошибка: ' + res.error() + '</div>';
        } else {
            if (installMsg) installMsg.innerHTML = '<div class="status ok">Готово!</div>';
            BX24.installFinish();
        }
    });
}

function initWidget(dealId) {
    console.log('Функция initWidget запущена для DealID:', dealId);
    
    const loadingEl = document.getElementById('loading');
    const widgetEl = document.getElementById('widget');
    const brandSelect = document.getElementById('brand');
    const modelSelect = document.getElementById('model');
    const saveBtn = document.getElementById('saveBtn');
    const statusEl = document.getElementById('status');

    // Проверка, что элементы нашлись if found (если тут null — проблема в HTML)
    if (!brandSelect || !modelSelect || !saveBtn || !statusEl) {
        console.error('КРИТИЧЕСКАЯ ОШИБКА: Не найдены HTML элементы! Проверь id в HTML.');
        console.error('brand:', brandSelect, 'model:', modelSelect, 'btn:', saveBtn, 'status:', statusEl);
        return;
    }

    if (loadingEl) loadingEl.style.display = 'none';
    if (widgetEl) widgetEl.style.display = 'block';

    console.log('5. Запрашиваем поля смарт-процесса...');
    BX24.callMethod('crm.item.fields', { entityTypeId: CONFIG.SMART_PROCESS_ID }, function(res) {
        console.log('6. Результат crm.item.fields:', res);
        if (res.error()) {
            console.error('ОШИБКА в crm.item.fields:', res.error());
            if (statusEl) {
                statusEl.className = 'status err';
                statusEl.textContent = 'Ошибка загрузки марок: ' + res.error();
            }
            return;
        }
        
        const fields = res.data().fields;
        const items = fields[CONFIG.BRAND_FIELD_ID]?.items || [];
        console.log('7. Найдено марок:', items.length);

        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.ID;
            opt.textContent = item.VALUE;
            brandSelect.appendChild(opt);
            brandMap[item.ID] = item.VALUE;
        });

        console.log('8. Загружаем текущие данные сделки...');
        loadCurrentDeal(dealId, brandSelect, modelSelect, statusEl);
    });

    brandSelect.addEventListener('change', function() {
        console.log('Смена марки. Новый ID:', this.value);
        const brandId = this.value;
        modelSelect.innerHTML = '<option value="">Загрузка...</option>';
        modelSelect.disabled = true;

        if (!brandId) {
            modelSelect.innerHTML = '<option value="">— сначала выберите марку —</option>';
            return;
        }

        console.log('9. Запрашиваем модели для ID:', brandId);
        BX24.callMethod('crm.item.list', {
            entityTypeId: CONFIG.SMART_PROCESS_ID,
            filter: { [CONFIG.BRAND_FIELD_ID]: brandId },
            select: [CONFIG.MODEL_FIELD_ID]
        }, function(res) {
            console.log('10. Результат crm.item.list:', res);
            if (res.error()) {
                modelSelect.innerHTML = '<option value="">Ошибка загрузки моделей</option>';
                return;
            }
            const items = res.data().items || [];
            modelSelect.innerHTML = '<option value="">— выберите модель —</option>';
            items.forEach(item => {
                const val = item[CONFIG.MODEL_FIELD_ID];
                if (val) {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    modelSelect.appendChild(opt);
                }
            });
            modelSelect.disabled = false;
        });
    });

    saveBtn.addEventListener('click', function() {
        console.log('Клик по кнопке Сохранить');
        const selectedBrandId = brandSelect.value;
        const selectedModel = modelSelect.value;
        console.log('Данные для сохранения:', { selectedBrandId, selectedModel });

        if (!selectedBrandId || !selectedModel) {
            if (statusEl) {
                statusEl.className = 'status err';
                statusEl.textContent = 'Выберите марку и модель!';
            }
            return;
        }

        const fields = {};
        fields[CONFIG.DEAL_BRAND_FIELD] = brandMap[selectedBrandId];
        fields[CONFIG.DEAL_MODEL_FIELD] = selectedModel;

        console.log('11. Отправляем crm.item.update...', fields);
        saveBtn.disabled = true;
        BX24.callMethod('crm.item.update', {
            entityTypeId: 2,
            id: dealId,
            fields: fields
        }, function(res) {
            console.log('12. Результат crm.item.update:', res);
            saveBtn.disabled = false;
            if (res.error()) {
                if (statusEl) {
                    statusEl.className = 'status err';
                    statusEl.textContent = 'Ошибка сохранения: ' + res.error();
                }
            } else {
                if (statusEl) {
                    statusEl.className = 'status ok';
                    statusEl.textContent = 'Сохранено!';
                }
            }
        });
    });
}

function loadCurrentDeal(id, brandSelect, modelSelect, statusEl) {
    console.log('Загрузка значений сделки для ID:', id);
    BX24.callMethod('crm.item.get', { entityTypeId: 2, id: id }, function(res) {
        console.log('Результат crm.item.get:', res);
        if (res.error()) {
            console.error('Ошибка crm.item.get:', res.error());
            if (statusEl) {
                statusEl.className = 'status err';
                statusEl.textContent = 'Не удалось прочитать сделку';
            }
            return;
        }
        const deal = res.data().item;
        const savedBrandText = deal[CONFIG.DEAL_BRAND_FIELD];
        if (savedBrandText) {
            for (let id in brandMap) {
                if (brandMap[id] === savedBrandText) {
                    brandSelect.value = id;
                    brandSelect.dispatchEvent(new Event('change'));
                    break;
                }
            }
        }
        setTimeout(() => {
            const savedModel = deal[CONFIG.DEAL_MODEL_FIELD];
            if (savedModel) {
                modelSelect.value = savedModel;
                console.log('Модель установлена из сделки:', savedModel);
            }
        }, 1000);
    });
}

function showStatus(msg, type, el) {
    if (el) {
        el.textContent = msg;
        el.className = 'status ' + type;
        setTimeout(() => { el.className = 'status'; }, 3000);
    }
}
</script>
