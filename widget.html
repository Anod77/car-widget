<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марка и модель</title>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <style>
        - { box-sizing: border-box; }
        body { font-family: sans-serif; padding: 15px; color: #333; }
        label { display: block; font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
        select { padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; width: 100%; background: #2fc7f1; color: #fff; border: none; border-radius: 4px; margin-top: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        .status { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 14px; display: none; }
        .status.ok { display: block; background: #d4edda; color: #155724; }
        .status.err { display: block; background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div id="loading">Загрузка...</div>

    <div id="widget" style="display:none;">
        <h3>Автомобиль</h3>
        
        <label>Марка</label>
        <select id="brand-select">
            <option value="">— выберите марку —</option>
        </select>

        <label>Модель</label>
        <select id="model-select" disabled>
            <option value="">— сначала выберите марку —</option>
        </select>

        <button id="save-btn">Сохранить в сделку</button>
        <div id="status-msg" class="status"></div>
    </div>

    <div id="install" style="display:none;">
        <h3>Установка...</h3>
        <div id="install-msg">Регистрация вкладки...</div>
    </div>

<script>
// ============================================================
// КОНФИГУРАЦИЯ
// ============================================================
const CONFIG = {
    SMART_PROCESS_ID: 1038,
    BRAND_FIELD_ID: 'ufCrm8_1790681113', // ID поля в смарт-процессе
    MODEL_FIELD_ID: 'ufCrm8_1790681206', // ID поля в смарт-процессе
    
    DEAL_BRAND_FIELD: 'ufCrm_1790687507745', // Поле в Сделке (String)
    DEAL_MODEL_FIELD: 'ufCrm_1790687534528', // Поле в Сделке (String)
    
    HANDLER_URL: '[url=https://Anod77.github.io/car-widget/widget.html]https://Anod77.github.io/car-widget/widget.html[/url]
};

// Хранилище для соответствия ID -> Текст (чтобы при сохранении писать "Форд", а не "52")
let brandMap = {};

BX24.ready(function() {
    BX24.init(function() {
        const info = BX24.placement.info();
        if (info && info.placement === 'CRM_DEAL_DETAIL_TAB') {
            initWidget(info.options.ID);
        } else {
            runInstall();
        }
    });
});

function runInstall() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('install').style.display = 'block';
    BX24.callMethod('placement.bind', {
        PLACEMENT: 'CRM_DEAL_DETAIL_TAB',
        HANDLER: CONFIG.HANDLER_URL,
        TITLE: 'Марка и модель'
    }, function(res) {
        if (res.error()) {
            document.getElementById('install-msg').innerHTML = 'Ошибка: ' + res.error();
        } else {
            document.getElementById('install-msg').innerHTML = 'Готово! Вкладка появилась.';
            BX24.installFinish();
        }
    });
}

function initWidget(dealId) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('widget').style.display = 'block';

    const brandSelect = document.getElementById('brand-select');
    const modelSelect = document.getElementById('model-select');
    const saveBtn = document.getElementById('save-btn');

    // 1. Загружаем список марок (Enumeration)
    BX24.callMethod('crm.item.fields', { entityTypeId: CONFIG.SMART_PROCESS_ID }, function(res) {
        if (res.error()) return alert('Ошибка полей: ' + res.error());
        
        const items = res.data().fields[CONFIG.BRAND_FIELD_ID].items || [];
        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.ID; // Кладем ID
            opt.textContent = item.VALUE; // Показываем текст
            brandSelect.appendChild(opt);
            brandMap[item.ID] = item.VALUE; // Запоминаем связь
        });

        // 2. Загружаем текущие данные сделки
        loadCurrentDeal(dealId);
    });

    // 3. Событие смены марки
    brandSelect.addEventListener('change', function() {
        const brandId = this.value;
        modelSelect.innerHTML = '<option value="">Загрузка...</option>';
        modelSelect.disabled = true;

        if (!brandId) {
            modelSelect.innerHTML = '<option value="">— сначала выберите марку —</option>';
            return;
        }

        // Фильтруем по ID (как в твоем тесте!)
        BX24.callMethod('crm.item.list', {
            entityTypeId: CONFIG.SMART_PROCESS_ID,
            filter: { [CONFIG.BRAND_FIELD_ID]: brandId },
            select: [CONFIG.MODEL_FIELD_ID]
        }, function(res) {
            if (res.error()) {
                modelSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                return;
            }
            const items = res.data().items || [];
            modelSelect.innerHTML = '<option value="">— выберите модель —</option>';
            items.forEach(item => {
                const val = item[CONFIG.MODEL_FIELD_ID];
                if (val) {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    modelSelect.appendChild(opt);
                }
            });
            modelSelect.disabled = false;
        });
    });

    // 4. Сохранение
    saveBtn.addEventListener('click', function() {
        const selectedBrandId = brandSelect.value;
        const selectedModel = modelSelect.value;

        if (!selectedBrandId || !selectedModel) {
            showStatus('Выберите марку и модель!', 'err');
            return;
        }

        const fields = {};
        fields[CONFIG.DEAL_BRAND_FIELD] = brandMap[selectedBrandId]; // Пишем ТЕКСТ марки
        fields[CONFIG.DEAL_MODEL_FIELD] = selectedModel; // Пишем ТЕКСТ модели

        saveBtn.disabled = true;
        BX24.callMethod('crm.item.update', {
            entityTypeId: 2,
            id: dealId,
            fields: fields
        }, function(res) {
            saveBtn.disabled = false;
            if (res.error()) {
                showStatus('Ошибка: ' + res.error(), 'err');
            } else {
                showStatus('Сохранено!', 'ok');
            }
        });
    });

    function loadCurrentDeal(id) {
        BX24.callMethod('crm.item.get', { entityTypeId: 2, id: id }, function(res) {
            if (res.error()) return;
            const deal = res.data().item;
            
            // Ищем марку по тексту
            const savedBrandText = deal[CONFIG.DEAL_BRAND_FIELD];
            if (savedBrandText) {
                for (let id in brandMap) {
                    if (brandMap[id] === savedBrandText) {
                        brandSelect.value = id;
                        // Имитируем смену, чтобы подгрузились модели
                        brandSelect.dispatchEvent(new Event('change'));
                        break;
                    }
                }
            }

            // Устанавливаем модель через небольшую паузу после загрузки списка
            setTimeout(() => {
                const savedModel = deal[CONFIG.DEAL_MODEL_FIELD];
                if (savedModel) {
                    modelSelect.value = savedModel;
                }
            }, 1000);
        });
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status-msg');
        el.textContent = msg;
        el.className = 'status ' + type;
        setTimeout(() => { el.className = 'status'; }, 3000);
    }
}
</script>
</body>
</html>
